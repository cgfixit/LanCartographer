name: static checks

# Free, tokenless checks that complement ci.yml and gitleaks.yml:
# - govulncheck: Go vulnerabilities this code actually reaches.
# - actionlint: workflow syntax, expressions and embedded shell (shellcheck).
# - zizmor: GitHub Actions security audit, offline (no API token).
# Kept out of ci.yml so a newly published advisory does not block unrelated
# PRs or the main-<sha> prerelease, which gates on CI only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new advisories surface even when the code does not change.
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    # internal/gui needs CGO and does not build on Linux; mirror ci.yml's
    # Windows toolchain so every package is analyzed.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up MSYS2 (ucrt64 gcc for CGO)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Add ucrt64 gcc to PATH
        run: echo "C:/msys64/ucrt64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: govulncheck
        shell: bash
        run: CGO_ENABLED=1 CC=gcc go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # ubuntu-latest ships shellcheck, which actionlint runs on run: blocks.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor (offline)
        # Low severity and above fail the job; informational findings (e.g.
        # superfluous-actions) are filtered out.
        run: pipx run zizmor==1.32.0 --offline --min-severity=low --format=github .github/workflows
