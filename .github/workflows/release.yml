# Release workflow for LanCartographer.
# Notes:
# - The Windows app manifest is asInvoker: the GUI binary never requests
#   administrator elevation (no requireAdministrator), so no special
#   permissions are needed to run it.
# - Binaries are shipped unsigned; Authenticode code signing is recommended
#   (see README) but intentionally not required for this release.
# - LanCartographer targets Windows 10/11 and macOS 13+. Do NOT claim
#   Windows 7 support anywhere in release notes or artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 8,20 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (only when dispatched from a v* tag; false builds a preview)"
        type: boolean
        default: false

# Tag pushes, the twice-daily schedule, and manual runs all build and verify
# every platform; only a v* tag ref publishes (a dispatch also needs publish).
# Runs queue instead of cancelling so a publish is never interrupted.
concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The schedule only rebuilds when main has moved. Each run costs one Windows
  # and two macOS runners, and macOS minutes bill at roughly ten times the
  # Linux rate on a private repository. The 14-hour window covers the 12-hour
  # cron gap plus a delayed start. Tag pushes and manual runs always build.
  changes:
    name: Check for new commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'schedule'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Decide whether to build
        id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -le $(( 14 * 3600 )) ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "main unchanged for ${age}s; skipping scheduled build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Windows binaries
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MSYS2 (ucrt64 gcc)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          # Same toolchain CI verified; a full pacman upgrade adds minutes
          # and can ship a compiler CI never ran.
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Add ucrt64 toolchain to PATH
        run: echo "C:/msys64/ucrt64/bin" >> "$env:GITHUB_PATH"

      - name: Install Windows resource generator
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0

      - name: Generate embedded resources
        shell: bash
        run: |
          export CGO_ENABLED=1
          export CC=gcc
          go generate ./...

      - name: Build GUI binary
        shell: bash
        run: |
          export CGO_ENABLED=1
          export CC=gcc
          go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/LanCartographer.exe ./cmd/lancartographer

      - name: Build CLI binary
        shell: bash
        run: |
          export CGO_ENABLED=1
          export CC=gcc
          go build -trimpath -ldflags "-s -w" -o dist/lancartographer-cli.exe ./cmd/lancartographer

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cp LICENSE dist/LICENSE
          cd dist
          sha256sum LanCartographer.exe lancartographer-cli.exe LICENSE > SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LanCartographer-windows
          path: |
            dist/LanCartographer.exe
            dist/lancartographer-cli.exe
            dist/LICENSE
            dist/SHA256SUMS.txt

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and validate macOS release bundle
        run: bash deploy/build.sh

      - name: Exercise packaged CLI on loopback
        run: python3 tests/macos-smoke.py dist

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LanCartographer-macos-${{ matrix.arch }}
          path: dist/LanCartographer-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish all platform assets
    needs: [build, build-macos]
    # Scheduled and branch runs have no tag to release; they stop after the
    # verified builds instead of failing in action-gh-release.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: LanCartographer-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/LanCartographer.exe
            dist/lancartographer-cli.exe
            dist/LICENSE
            dist/SHA256SUMS.txt
            dist/LanCartographer-macos-arm64.zip
            dist/LanCartographer-macos-amd64.zip
