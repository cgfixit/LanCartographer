# Release workflow for LanCartographer.
# Notes:
# - The Windows app manifest is asInvoker: the GUI binary never requests
#   administrator elevation (no requireAdministrator), so no special
#   permissions are needed to run it.
# - Binaries are shipped unsigned; Authenticode code signing is recommended
#   (see README) but intentionally not required for this release.
# - LanCartographer targets Windows 10/11 and macOS 13+. Do NOT claim
#   Windows 7 support anywhere in release notes or artifacts.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build and release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Set up MSYS2 (ucrt64 gcc)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Add ucrt64 toolchain to PATH
        run: echo "C:/msys64/ucrt64/bin" >> "$env:GITHUB_PATH"

      - name: Generate embedded resources
        shell: bash
        run: |
          export CGO_ENABLED=1
          export CC=gcc
          go generate ./...

      - name: Build GUI binary
        shell: bash
        run: |
          export CGO_ENABLED=1
          export CC=gcc
          go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/LanCartographer.exe ./cmd/lancartographer

      - name: Build CLI binary
        shell: bash
        run: |
          export CGO_ENABLED=1
          export CC=gcc
          go build -trimpath -ldflags "-s -w" -o dist/lancartographer-cli.exe ./cmd/lancartographer

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum LanCartographer.exe lancartographer-cli.exe > SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LanCartographer-windows
          path: |
            dist/LanCartographer.exe
            dist/lancartographer-cli.exe
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/LanCartographer.exe
            dist/lancartographer-cli.exe
            dist/SHA256SUMS.txt

  build-macos:
    name: Build macOS binaries
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Move Windows-only resource.syso aside (COFF breaks the darwin link)
        # Same story as the CI macos job: the checked-in resource.syso is an
        # amd64 COFF object; the go tool feeds .syso files to Apple's ld,
        # which rejects them. It is Windows-only output, so move it aside.
        run: mv cmd/lancartographer/resource.syso "$RUNNER_TEMP/resource.syso"

      - name: Generate embedded resources (icon only on macOS)
        run: |
          export CGO_ENABLED=1
          go generate ./...

      - name: Build GUI binary
        run: |
          export CGO_ENABLED=1
          go build -trimpath -ldflags "-s -w" -o dist-darwin/LanCartographer ./cmd/lancartographer

      - name: Build CLI binary
        run: |
          export CGO_ENABLED=1
          go build -trimpath -ldflags "-s -w" -o dist-darwin/lancartographer-cli ./cmd/lancartographer

      - name: Generate SHA256 checksums and zip
        run: |
          cd dist-darwin
          shasum -a 256 LanCartographer lancartographer-cli > SHA256SUMS.txt
          zip ../LanCartographer-macos.zip LanCartographer lancartographer-cli SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LanCartographer-macos
          path: LanCartographer-macos.zip
