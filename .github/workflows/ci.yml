name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the older run; main runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MSYS2 (ucrt64 gcc for CGO)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Add ucrt64 gcc to PATH
        run: echo "C:/msys64/ucrt64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install goversioninfo (generates resource.syso from versioninfo.json)
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0

      - name: gofmt check (must be empty)
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
          echo "gofmt: PASS"

      - name: go vet
        shell: bash
        run: go vet ./...

      - name: go generate drift check
        shell: bash
        run: |
          go generate ./...
          # go.sum may drift as a dependency side effect; resource.syso
          # bytes depend on the goversioninfo build version (differs between
          # dev machines and CI) — the deterministic Go-generated files must
          # not drift, so those two are excluded here.
          git diff --exit-code -- ':(exclude)go.sum' ':(exclude)cmd/lancartographer/resource.syso'

      - name: CGO go build
        shell: bash
        run: CGO_ENABLED=1 CC=gcc go build ./...

      - name: CGO go test with race detector
        shell: bash
        run: CGO_ENABLED=1 CC=gcc go test ./... -race

      # Cross-compile smokes cover every package EXCEPT the GUI entry points:
      # Fyne on desktop requires CGO (go-gl/glfw; internal/app/theme_darwin.go
      # links the Foundation framework), so a CGO-off cross-compile of
      # internal/gui and cmd/lancartographer can never succeed. The full GUI
      # build for darwin is covered natively by the macos job below.
      - name: Cross-compile smoke (darwin/arm64, non-GUI packages)
        shell: bash
        run: |
          mapfile -t packages < <(go list ./... | grep -vE 'internal/gui|cmd/lancartographer')
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build "${packages[@]}"

      - name: Cross-compile smoke (linux/amd64, non-GUI packages)
        shell: bash
        run: |
          mapfile -t packages < <(go list ./... | grep -vE 'internal/gui|cmd/lancartographer')
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build "${packages[@]}"

  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and validate macOS release bundle
        run: bash deploy/build.sh

      - name: Exercise packaged CLI on loopback
        run: python3 tests/macos-smoke.py dist

      - name: Move Windows-only resource.syso aside (COFF breaks the darwin link)
        # cmd/lancartographer/resource.syso is a checked-in amd64 COFF .rsrc
        # object. The go tool passes .syso files to the external linker on
        # every platform, and Apple's ld rejects COFF with
        # "ld: unknown file type in .../000000.o". The file only matters for
        # the Windows build (it is regenerated there by go generate), so move
        # it aside in this checkout for the whole macos job.
        run: mv cmd/lancartographer/resource.syso "$RUNNER_TEMP/resource.syso"

      - name: CGO go build
        run: CGO_ENABLED=1 go build ./...

      - name: go vet
        run: go vet ./...

      - name: CGO go test with race detector
        run: CGO_ENABLED=1 go test ./... -race
