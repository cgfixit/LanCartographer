name: debug-macos

on:
  push:
    branches: [kimi/ci-first-run-fixes]
    paths: ['.github/workflows/debug-macos.yml']

permissions:
  contents: read

jobs:
  facts:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Elimination links — which cgo dep breaks the final link
        run: |
          cd "$GITHUB_WORKSPACE"
          for pkg in \
            'glfw github.com/go-gl/glfw/v3.4/glfw' \
            'gl github.com/go-gl/gl/v2.1/gl' \
            'systray fyne.io/systray' \
            'fyneapp fyne.io/fyne/v2/app' \
            'driver fyne.io/fyne/v2/internal/driver/glfw' ; do
            name="${pkg%% *}"; path="${pkg#* }"
            mkdir -p "_linktest/$name"
            cat > "_linktest/$name/main.go" <<EOF
          package main

          import _ "$path"

          func main() {}
          EOF
            echo "=== link test: $name ($path)"
            if CGO_ENABLED=1 go build -o /dev/null "./_linktest/$name" 2>&1 | tail -6; then
              echo "=== $name: OK"
            else
              echo "=== $name: FAIL"
            fi
          done

      - name: Dump the bad object (preserve linker tmpdir)
        run: |
          cd "$GITHUB_WORKSPACE"
          LT="$RUNNER_TEMP/linktmp"
          mkdir -p "$LT"
          CGO_ENABLED=1 go build -ldflags="-tmpdir=$LT" ./cmd/lancartographer 2>&1 | tail -5 || true
          echo "--- file(1) on linker objects ---"
          for f in "$LT"/*.o; do echo "== $(basename "$f")"; file "$f"; done | head -60
          echo "--- 000000.o magic bytes ---"
          xxd "$LT"/000000.o 2>/dev/null | head -4
          echo "--- otool -h 000000.o ---"
          otool -h "$LT"/000000.o 2>&1 | head -15
          echo "--- compare with go.o ---"
          file "$LT"/go.o; xxd "$LT"/go.o | head -2
