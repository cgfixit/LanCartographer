name: debug-macos

on:
  push:
    branches: [kimi/ci-first-run-fixes]
    paths: ['.github/workflows/debug-macos.yml']

permissions:
  contents: read

jobs:
  facts:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: System facts
        run: |
          sw_vers
          echo "--- clang ---"
          clang --version
          echo "--- xcode-select ---"
          xcode-select -p
          echo "--- xcrun ---"
          xcrun -f clang && xcrun --show-sdk-path && xcrun --sdk macosx --show-sdk-version
          echo "--- ld ---"
          xcrun -f ld && ld -version_details 2>/dev/null | head -5 || ld -v 2>&1 | head -3
          echo "--- go ---"
          go version
          go env CGO_ENABLED CGO_CFLAGS CGO_LDFLAGS CC CXX GOFLAGS GOARM64 SDKROOT

      - name: Minimal cgo repro (clang link)
        run: |
          mkdir -p /tmp/cgotest && cd /tmp/cgotest
          cat > main.go <<'EOF'
          package main

          /*
          #include <stdio.h>
          static int add(int a, int b) { return a + b; }
          */
          import "C"
          import "fmt"

          func main() { fmt.Println("cgo ok:", C.add(1, 2)) }
          EOF
          cat > go.mod <<'EOF'
          module cgotest

          go 1.27
          EOF
          CGO_ENABLED=1 go build -x . 2>&1 | tail -30
          ./cgotest

      - name: Minimal cgo repro with -framework flags (Fyne-style link)
        run: |
          cd /tmp/cgotest
          cat > main.go <<'EOF'
          package main

          /*
          #cgo LDFLAGS: -framework OpenGL -framework Cocoa -framework IOKit -framework CoreVideo -framework CoreGraphics -framework Foundation
          #include <stdio.h>
          static int add(int a, int b) { return a + b; }
          */
          import "C"
          import "fmt"

          func main() { fmt.Println("cgo frameworks ok:", C.add(2, 3)) }
          EOF
          CGO_ENABLED=1 go build -x . 2>&1 | tail -40
          ./cgotest

      - name: Build fyne alone
        run: |
          cd "$GITHUB_WORKSPACE"
          CGO_ENABLED=1 go build fyne.io/fyne/v2 2>&1 | tail -20 && echo "FYNE BUILD OK"

      - name: Failing build with -x (capture package + linker line)
        run: |
          cd "$GITHUB_WORKSPACE"
          CGO_ENABLED=1 go build -x ./... 2>&1 | tail -120
        continue-on-error: true

      - name: Failing build retry (cache warm)
        run: |
          cd "$GITHUB_WORKSPACE"
          CGO_ENABLED=1 go build ./...
