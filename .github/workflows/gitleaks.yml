name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists PR commits via the REST API on pull_request events.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # gitleaks-action computes the push-event commit range; a
          # shallow (depth-1) checkout lacks the base commit.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Required by gitleaks-action v2 for pull_request scans.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
