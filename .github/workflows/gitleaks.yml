name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists PR commits via the REST API on pull_request events.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks-action computes the push-event commit range; a
          # shallow (depth-1) checkout lacks the base commit.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action v2 for pull_request scans.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
